name: Build OrangeFox X806B

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Device-tree branch'
        required: true
        default: 'mainbranch'
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build OrangeFox for SM-X806B
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/share/powershell
          sudo docker system prune -af || true
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev \
            libssl-dev libxml2-utils lz4 pngcrush rsync unzip zip zlib1g-dev
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Google repo tool
        shell: bash
        run: |
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o repo
          chmod +x repo
          sudo install -m 0755 repo /usr/local/bin/repo
          repo --version

      - name: Sync OrangeFox fox_12.1
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fox_12.1"
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git "$GITHUB_WORKSPACE/OrangeFox_sync"
          cd "$GITHUB_WORKSPACE/OrangeFox_sync"
          chmod +x orangefox_sync.sh
          ./orangefox_sync.sh --branch 12.1 --path "$GITHUB_WORKSPACE/fox_12.1"

      - name: Install X806B device tree
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/fox_12.1/device/samsung/gts8p"
          git clone --depth=1 \
            --branch "${{ inputs.branch }}" \
            https://github.com/honhan0904/orangefox_device_samsung_gts8p.git \
            "$GITHUB_WORKSPACE/fox_12.1/device/samsung/gts8p"

      - name: Verify device tree
        working-directory: ${{ github.workspace }}/fox_12.1
        shell: bash
        run: |
          test -f device/samsung/gts8p/BoardConfig.mk
          test -f device/samsung/gts8p/AndroidProducts.mk
          test -f device/samsung/gts8p/orangefox_gts8p.mk
          test -f device/samsung/gts8p/vendorsetup.sh
          test -f device/samsung/gts8p/prebuilt/Image
          test -f device/samsung/gts8p/prebuilt/Image.gz
          test -f device/samsung/gts8p/prebuilt/dtb
          test -f device/samsung/gts8p/prebuilt/recovery_dtbo
          grep -q 'PRODUCT_NAME := orangefox_gts8p' device/samsung/gts8p/orangefox_gts8p.mk
          grep -q 'orangefox_gts8p-eng' device/samsung/gts8p/AndroidProducts.mk
          grep -q 'TW_THEME := portrait_hdpi' device/samsung/gts8p/BoardConfig.mk
          grep -q 'BOARD_KERNEL_BASE := 0x00000000' device/samsung/gts8p/BoardConfig.mk
          grep -q 'BOARD_KERNEL_OFFSET := 0x00008000' device/samsung/gts8p/BoardConfig.mk
          grep -q 'BOARD_RAMDISK_OFFSET := 0x02000000' device/samsung/gts8p/BoardConfig.mk

      - name: Ensure portrait theme assets
        working-directory: ${{ github.workspace }}/fox_12.1
        shell: bash
        run: |
          THEME_DIR="bootable/recovery/gui/theme/portrait_hdpi"
          if [ ! -s "$THEME_DIR/ui.xml" ]; then
            echo "OrangeFox fox_12.1 is missing portrait_hdpi/ui.xml; importing the TWRP 12.1 portrait theme as a build fallback."
            rm -rf "$GITHUB_WORKSPACE/twrp-theme"
            git clone --depth=1 --filter=blob:none --sparse --branch android-12.1 \
              https://github.com/TeamWin/android_bootable_recovery.git \
              "$GITHUB_WORKSPACE/twrp-theme"
            git -C "$GITHUB_WORKSPACE/twrp-theme" sparse-checkout set gui/theme
            rm -rf bootable/recovery/gui/theme
            mkdir -p bootable/recovery/gui
            cp -a "$GITHUB_WORKSPACE/twrp-theme/gui/theme" bootable/recovery/gui/
          fi
          test -s "$THEME_DIR/ui.xml"
          test -s "bootable/recovery/gui/theme/common/portrait.xml"
          find "$THEME_DIR" -maxdepth 1 -type f -print | sort

      - name: Prepare AVB tool
        working-directory: ${{ github.workspace }}/fox_12.1
        shell: bash
        run: |
          test -f external/avb/avbtool.py
          install -D -m 0755 external/avb/avbtool.py out/host/linux-x86/bin/avbtool
          out/host/linux-x86/bin/avbtool version

      - name: Configure build memory and parallelism
        shell: bash
        run: |
          echo "Runner CPU/memory before build:"
          nproc
          free -h
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "Runner CPU/memory after enabling 8G swap:"
          free -h
          swapon --show

      - name: Build OrangeFox
        working-directory: ${{ github.workspace }}/fox_12.1
        shell: bash
        run: |
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=gts8p
          export OF_FORCE_PREBUILT_KERNEL=1
          export OF_DEFAULT_KEYMASTER_VERSION=4.1
          export OF_DISABLE_MIUI_SPECIFIC_FEATURES=1
          export TARGET_PRODUCT=orangefox_gts8p
          export TARGET_BUILD_VARIANT=eng
          export TARGET_BUILD_TYPE=release
          export LC_ALL=C

          set -o pipefail
          set +e
          source build/envsetup.sh > "$GITHUB_WORKSPACE/envsetup-trace.log" 2>&1
          ENV_RC=$?
          set -e
          cat "$GITHUB_WORKSPACE/envsetup-trace.log"
          echo "envsetup command exit code: $ENV_RC"
          echo "TARGET_PRODUCT=$TARGET_PRODUCT"
          echo "TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT"
          echo "ANDROID_BUILD_TOP=$ANDROID_BUILD_TOP"
          command -v mka
          echo "Build parallelism: -j2"
          mka -j2 recoveryimage 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify recovery image header
        if: success()
        working-directory: ${{ github.workspace }}/fox_12.1
        shell: python
        run: |
          import struct
          from pathlib import Path
          p = Path("out/target/product/gts8p/recovery.img")
          data = p.read_bytes()[:1680]
          assert data[:8] == b"ANDROID!", "Not an Android boot image"
          # Android boot header order: kernel_size, kernel_addr, ramdisk_size,
          # ramdisk_addr, second_size, second_addr, tags_addr, page_size,
          # header_version, os_version.
          kernel_size, kernel_addr, ramdisk_size, ramdisk_addr, second_size, second_addr, tags_addr, page_size, header_version, os_version = struct.unpack_from("<10I", data, 8)
          recovery_dtbo_size = struct.unpack_from("<I", data, 1632)[0]
          recovery_dtbo_offset = struct.unpack_from("<Q", data, 1636)[0]
          dtb_size = struct.unpack_from("<I", data, 1648)[0]
          dtb_addr = struct.unpack_from("<Q", data, 1652)[0]
          print(f"kernel_size={kernel_size}")
          print(f"kernel_addr=0x{kernel_addr:08x}")
          print(f"ramdisk_size={ramdisk_size}")
          print(f"tags_addr=0x{tags_addr:08x}")
          print(f"recovery_dtbo_size={recovery_dtbo_size}")
          print(f"recovery_dtbo_offset=0x{recovery_dtbo_offset:08x}")
          print(f"dtb_size={dtb_size}")
          print(f"dtb_addr=0x{dtb_addr:08x}")
          print(f"header_version={header_version}")
          assert kernel_addr == 0x00008000, f"kernel_addr mismatch: 0x{kernel_addr:x}"
          assert ramdisk_addr == 0x02000000, f"ramdisk_addr mismatch: 0x{ramdisk_addr:x}"
          assert tags_addr == 0x01e00000, f"tags_addr mismatch: 0x{tags_addr:x}"
          assert dtb_size == 1721460, f"DTB size mismatch: {dtb_size}"
          assert dtb_addr == 0x01f00000, f"DTB addr mismatch: 0x{dtb_addr:x}"
          assert recovery_dtbo_size == 2807348, f"recovery_dtbo size mismatch: {recovery_dtbo_size}"

      - name: Collect build outputs
        if: always()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp -v fox_12.1/out/target/product/gts8p/recovery.img "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true
          cp -v fox_12.1/out/target/product/gts8p/recovery.tar "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true
          cp -v fox_12.1/out/target/product/gts8p/OrangeFox-unofficial-gts8p.img "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true
          cp -v build.log "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true
          cp -v "$GITHUB_WORKSPACE/envsetup-trace.log" "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true
          if [ -f "$GITHUB_WORKSPACE/fox_12.1/out/target/product/gts8p/recovery.img" ]; then
            sha256sum "$GITHUB_WORKSPACE/fox_12.1/out/target/product/gts8p/recovery.img" | tee "$GITHUB_WORKSPACE/artifacts/recovery.sha256"
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-gts8p
          path: artifacts/
          if-no-files-found: warn
